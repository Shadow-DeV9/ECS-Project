name: Terraform Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  id-token: write # needed for OIDC
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_WORKING_DIR: terraform

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan -no-color

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Post-deploy health check
        run: |
          echo "Waiting 30 seconds for resources to stabilise..."
          sleep 30
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://tm.shoshin.org.uk/health)
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Health check failed! Got HTTP $RESPONSE"
            exit 1
          fi
          echo "✅ Health check passed! Got HTTP $RESPONSE"

      - name: Job summary
        if: always()
        run: |
          echo "## 🏗️ Terraform Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | ${{ env.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Working Dir** | ${{ env.TF_WORKING_DIR }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health Check URL** | https://tm.shoshin.org.uk/health |" >> $GITHUB_STEP_SUMMARY
